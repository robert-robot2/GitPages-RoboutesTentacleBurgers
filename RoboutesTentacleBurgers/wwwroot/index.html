hese are paths that your WebGL/engine code            // may request as root-relative URLs.            const wwwrootPaths = [                '/iAssets/',                '/iFonts/',                '/iJabba/',                '/iMeshes/',                '/iPython/',                '/iStyles/',                '/sample-data/',                '/wc1sprites/'            ];            function fixPath(value) {                if (typeof value !== 'string') {                    return value;                }                // Leave external URLs alone.                if (/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) {                    return value;                }                // Leave data/blob URLs alone.                if (                    value.startsWith('data:') ||                    value.startsWith('blob:')                ) {                    return value;                }                // Already has the GitHub Pages base.                if (value.startsWith(base)) {                    return value;                }                // Convert:                // /iAssets/foo.png                //                // into:                // /RTBVX-587/iAssets/foo.png                for (const path of wwwrootPaths) {                    if (value.startsWith(path)) {                        return base + value.substring(1);                    }                }                return value;            }            // ============================================================            // FETCH            // ============================================================            const originalFetch = window.fetch;            window.fetch = function (input, options) {                // fetch(Request, options)                if (input instanceof Request) {                    const fixedUrl = fixPath(input.url);                    if (fixedUrl !== input.url) {                        input = new Request(fixedUrl, input);                    }                }                // fetch("/iAssets/foo.png")                else {                    input = fixPath(input);                }                return originalFetch.call(this, input, options);            };            // ============================================================            // IMAGE            // ============================================================            const OriginalImage = window.Image;            window.Image = function (width, height) {                const img = new OriginalImage(width, height);                const descriptor =                    Object.getOwnPropertyDescriptor(                        OriginalImage.prototype,                        'src'                    );                Object.defineProperty(img, 'src', {                    set(value) {                        descriptor.set.call(                            img,                            fixPath(value)                        );                    },                    get() {                        return descriptor.get.call(img);                    }                });                return img;            };            // Preserve Image.prototype relationships as much as possible.            window.Image.prototype = OriginalImage.prototype;            // ============================================================            // XMLHttpRequest            // ============================================================            const originalOpen =                XMLHttpRequest.prototype.open;            XMLHttpRequest.prototype.open =                function (method, url, ...rest) {                    return originalOpen.call(                        this,                        method,                        fixPath(url),                        ...rest                    );                };            // ============================================================            // DYNAMIC IMG ELEMENTS            // ============================================================            function fixNode(node) {                if (node.tagName === 'IMG') {                    const src = node.getAttribute('src');                    if (src) {                        const fixed = fixPath(src);                        if (fixed !== src) {                            node.setAttribute('src', fixed);                        }                    }                }            }            // ============================================================            // MUTATION OBSERVER            // ============================================================            const observer =                new MutationObserver((mutations) => {                    for (const mutation of mutations) {                        // New elements                        for (const node of mutation.addedNodes) {                            if (node.nodeType === 1) {                                fixNode(node);                                node                                    .querySelectorAll('img')                                    .forEach(fixNode);                            }                        }                        // Existing IMG src changed                        if (                            mutation.type === 'attributes' &&                            mutation.target.tagName === 'IMG'                        ) {                            fixNode(mutation.target);                        }                    }                });            // body may not exist immediately in some circumstances,            // so start observing after DOM is ready.            function startObserver() {                if (!document.body) {                    return;                }                observer.observe(document.body, {                    childList: true,                    subtree: true,                    attributes: true,                    attributeFilter: ['src']                });            }            if (document.readyState === 'loading') {                document.addEventListener(                    'DOMContentLoaded',                    startObserver                );            } else {                startObserver();            }        })();    </script>    <!-- Jabba Scripts-->    <script src="iJabba/SnowGlobeEngine.js"></script>    <script src="iJabba/SpectralSystemLoaders.js"></script>    <script src="iJabba/SpectralShaders.js"></script>    <script src="iJabba/SpectralUI.js"></script>    <script src="iJabba/SpectralMeshLoaders.js"></script>    <script src="iJabba/SpectralWebGPUInterop.js"></script>    <script src="iJabba/SpectralWebGPUParticle.js"></script>    <script src="iJabba/SpectralTextRenderSystem.js"></script>    <script src="iJabba/SpectralParticleSystem.js"></script>    <script src="iJabba/SpectralStaticObjectsSystem.js"></script>    <script src="iJabba/SpectralSkySystem.js"></script>    <script src="iJabba/SpectralShootingStars.js"></script>    <script src="iJabba/SpectralLightningSystem.js"></script>    <script src="iJabba/SpectralStarField.js"></script>    <script src="iJabba/SpectralScrollbarSystem.js"></script>    <script src="iJabba/SpectralCubeCitySystem.js"></script>    <script src="iJabba/SpectralFXAA.js"></script>    <script src="iJabba/SpectralSMAA.js"></script>    <script src="iJabba/SpectralTAA.js"></script>    <script src="iJabba/SpectralAA.js"></script>    <script src="iJabba/SpectralAAV2.js"></script>    <script src="iJabba/SpectralAAV3.js"></script>    <script src="iJabba/SpectralTextureUploads.js"></script>    <script src="iJabba/SpectralEngine.js"></script>    <!--WarCraft Font-->    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">    <!-- Loads Pyodide (Python in the browser) fr
